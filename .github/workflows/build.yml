name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Supersede in-flight runs for the same ref (a new push to a PR cancels the old).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo.
permissions:
  contents: read

jobs:
  # Cheap, independent gates run in parallel so every failure is visible at once
  # and shows up as its own check.

  # Lints these workflow files themselves — a typo'd `runs-on` or a bad
  # expression otherwise only surfaces when a run fails at the wrong moment.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # Fails a PR that introduces a dependency with a known vulnerability, at the
  # moment it is proposed rather than after it is merged. Reviews the diff, so
  # there is nothing to review on a push to main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  # `next build` type-checks on its way through, but it does so after compiling.
  # Running tsc on its own first turns a type error into a ~30s failure instead
  # of a slower one, and shows up as its own check. The typecheck script runs
  # `next typegen` first because types like LayoutProps are generated into
  # .next/types, which is gitignored — so a fresh checkout has none.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      # Validates the Sanity schema AND asserts the validator actually saw our
      # types — "0 errors" means the same thing whether the schema is clean or
      # the CLI loaded no schema at all.
      - name: Check schema
        run: pnpm run check:schema

  build:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile also proves the vendored Sorbet tarballs resolve from
      # a clean checkout: no registry, no auth, just what is committed here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
