allowBuilds:
  # Sanity Studio bundles with esbuild, which links a native binary on install.
  esbuild: true
  sharp: false
  unrs-resolver: false

# Sorbet is vendored as tarballs (see vendor/), not installed from a registry.
# `pnpm pack` rewrites the component library's `workspace:*` dependency on the
# design system to a plain "0.1.0", so without this redirect pnpm goes looking
# for it on npm — where it isn't published — and the install 404s.
#
# This has to live here: pnpm 11 reads `overrides` from pnpm-workspace.yaml and
# ignores them in package.json with only a warning. For the same reason, never
# install with --ignore-workspace, which skips this file entirely.
overrides:
  "@sorbet/design-system": "file:./vendor/sorbet-design-system-0.1.0.tgz"

  # sanity → @sanity/cli → @vercel/frameworks pins js-yaml 3.13.1, which carries
  # four advisories including two high-severity quadratic-CPU DoS. 3.15.1 is the
  # backported fix for the 3.x line, so this stays on the same major and leaves
  # @vercel/frameworks' API expectations intact. Drop this once the upstream
  # chain moves on its own — Dependabot will not do it for us, since the
  # constraint lives three levels down someone else's tree.
  js-yaml: "^3.15.1"
